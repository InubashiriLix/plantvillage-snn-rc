name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MPLBACKEND: Agg
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            convsnn/pyproject.toml
            rc/requirements.txt
      - name: Install CPU dependencies and both packages
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './convsnn[dev]' -e ./rc
      - name: Unit and synthetic CPU integration tests
        run: python -m pytest -q
      - name: Entrypoint smoke and hardware handoff
        run: |
          python -m plantvillage_snn --help
          for script in rc/scripts/*.py; do python "$script" --help; done
          python rc/scripts/09_read_hardware_preview.py
      - name: Repository audit
        run: python tools/check_repository.py
